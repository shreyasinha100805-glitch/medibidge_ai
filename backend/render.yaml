services:
  - type: web
    name: medibridge-backend
    repo: https://github.com/shreyasinha100805-glitch/medibidge_ai.git
    branch: main
    runtime: node
    region: singapore
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: CLIENT_URL
        value: https://medibidge-ai.vercel.app
